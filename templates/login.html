{% extends "base.html" %}
{% block title %}Login — PawPulse{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🐾 PawPulse</div>
    <div class="auth-sub">Sign in to manage dogs and respond to emergencies</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in</button>
    </form>
    <div class="auth-footer">No account? <a href="{{ url_for('register') }}">Join as feeder or NGO</a></div>
  </div>
</div>
{% endblock %}
